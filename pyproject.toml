[project]
name = "alarm-clock"
version = "0.1.0"
description = "A simple CLI alarm clock"
requires-python = ">=3.10"

[project.scripts]
alarm = "alarm_clock.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alarm_clock"]
